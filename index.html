        <dialog id="addToDo">

                <tr>
                    <td >Title</td>
                    <td ><input type="text" name="" id="titleField"></td>
                </tr>
                <tr>
                    <td >Time</td>
                    <td ><input type="text" name="" id="timeField"></td>
                </tr>
            </table>
            
            <input type="button" value="+" onclick="addigTheCheckList()">
            <button onclick="document.getElementById('addToDo').close()">Close</button>
        </dialog>

        <div>
            <table id="checkListtbl">
                <tr>
                    <td><label for="" id="lbl">study</label></td>
                    <td><input type="checkbox" name="" id="checkBox" ></td>
                </tr>
            </table>
            
                
        </div>
        

    </div>
